<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskQueue</title>
    <link rel="icon" href="layers.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07080c;
        --surface: #0c0e14;
        --panel: #10121a;
        --border: rgba(255, 255, 255, 0.06);
        --border-hi: rgba(255, 255, 255, 0.12);
        --text: #d4dbe8;
        --sub: #5a6478;
        --dim: #2a3040;

        --blue: #4f8ef7;
        --blue-bg: rgba(79, 142, 247, 0.08);
        --blue-border: rgba(79, 142, 247, 0.2);
        --yellow: #f5a623;
        --yellow-bg: rgba(245, 166, 35, 0.08);
        --yellow-border: rgba(245, 166, 35, 0.2);
        --green: #34d399;
        --green-bg: rgba(52, 211, 153, 0.08);
        --green-border: rgba(52, 211, 153, 0.2);
        --red: #f87171;
        --red-bg: rgba(248, 113, 113, 0.08);
        --red-border: rgba(248, 113, 113, 0.2);
        --purple: #a78bfa;
        --orange: #fb923c;

        --mono: "IBM Plex Mono", monospace;
        --sans: "DM Sans", sans-serif;
        --r: 8px;
        --r2: 12px;
      }

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 14px;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--dim);
        border-radius: 2px;
      }

      header {
        height: 52px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 200;
        background: rgba(7, 8, 12, 0.92);
        backdrop-filter: blur(20px);
      }

      .wordmark {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 9px;
      }

      .wordmark-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 8px var(--blue);
      }

      .ws-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--sub);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 5px 12px 5px 9px;
        transition: border-color 0.3s;
      }

      .ws-pill.connected {
        border-color: var(--green-border);
      }

      .ws-pip {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
        transition:
          background 0.4s,
          box-shadow 0.4s;
      }

      .ws-pip.on {
        background: var(--green);
        box-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
        animation: breathe 2.5s ease-in-out infinite;
      }

      @keyframes breathe {
        0%,
        100% {
          box-shadow: 0 0 4px rgba(52, 211, 153, 0.4);
        }
        50% {
          box-shadow: 0 0 10px rgba(52, 211, 153, 0.15);
        }
      }

      main {
        max-width: 1380px;
        margin: 0 auto;
        padding: 24px 28px 60px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      /* ── sender ── */
      .sender {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r2);
        padding: 16px 20px;
        display: flex;
        align-items: flex-end;
        gap: 18px;
        flex-wrap: wrap;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sub);
      }

      /* ── custom dropdown ── */
      .dd-wrap {
        position: relative;
        user-select: none;
      }

      .dd-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        background: var(--panel);
        border: 1px solid var(--border-hi);
        border-radius: var(--r);
        padding: 9px 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        min-width: 190px;
        transition:
          border-color 0.2s,
          background 0.2s;
      }

      .dd-trigger:hover {
        border-color: rgba(255, 255, 255, 0.2);
      }
      .dd-trigger.open {
        border-color: var(--blue);
        background: var(--bg);
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }

      .dd-trigger svg {
        width: 13px;
        height: 13px;
        stroke: var(--sub);
        flex-shrink: 0;
        transition: transform 0.2s;
      }

      .dd-trigger.open svg {
        transform: rotate(180deg);
      }

      .dd-list {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--panel);
        border: 1px solid var(--blue);
        border-top: none;
        border-bottom-left-radius: var(--r);
        border-bottom-right-radius: var(--r);
        overflow: hidden;
        z-index: 300;
        display: none;
      }

      .dd-list.open {
        display: block;
      }

      .dd-list ul {
        list-style: none;
      }

      .dd-list ul li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--sub);
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition:
          background 0.12s,
          color 0.12s;
      }

      .dd-list ul li:last-child {
        border-bottom: none;
      }
      .dd-list ul li:hover {
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
      }

      .dd-list ul li.selected {
        color: var(--blue);
        background: var(--blue-bg);
      }

      .li-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .li-tag {
        margin-left: auto;
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 4px;
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid var(--red-border);
      }

      /* ── number input ── */
      .num-input {
        background: var(--panel);
        border: 1px solid var(--border-hi);
        border-radius: var(--r);
        padding: 9px 14px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text);
        width: 74px;
        outline: none;
        transition: border-color 0.2s;
      }

      .num-input:focus {
        border-color: var(--blue);
      }

      /* ── slider ── */
      .slider-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .slider-row input[type="range"] {
        width: 130px;
        -webkit-appearance: none;
        height: 3px;
        border-radius: 2px;
        background: var(--dim);
        outline: none;
        cursor: pointer;
      }

      .slider-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.15);
        cursor: pointer;
      }

      /* ── buttons ── */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-left: auto;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 9px 18px;
        border-radius: var(--r);
        border: none;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          filter 0.15s,
          transform 0.1s;
        white-space: nowrap;
      }

      .btn svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .btn:hover {
        filter: brightness(1.12);
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        transform: none;
      }

      .btn-blue {
        background: var(--blue);
        color: #fff;
      }
      .btn-ghost {
        background: var(--panel);
        color: var(--sub);
        border: 1px solid var(--border-hi);
      }
      .btn-ghost:hover {
        color: var(--text);
      }
      .btn-purple {
        background: rgba(167, 139, 250, 0.1);
        color: var(--purple);
        border: 1px solid rgba(167, 139, 250, 0.2);
      }
      .btn-green {
        background: var(--green-bg);
        color: var(--green);
        border: 1px solid var(--green-border);
      }
      .btn-red {
        background: var(--red-bg);
        color: var(--red);
        border: 1px solid var(--red-border);
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }

      /* ── stats ── */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .stat {
        background: var(--surface);
        border-radius: var(--r2);
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
      }

      .stat::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        opacity: 0.7;
      }

      .stat.blue::before {
        background: var(--blue);
      }
      .stat.yellow::before {
        background: var(--yellow);
      }
      .stat.green::before {
        background: var(--green);
      }
      .stat.red::before {
        background: var(--red);
      }

      .stat.blue {
        border-color: var(--blue-border);
      }
      .stat.yellow {
        border-color: var(--yellow-border);
      }
      .stat.green {
        border-color: var(--green-border);
      }
      .stat.red {
        border-color: var(--red-border);
      }

      .stat-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .stat-name {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sub);
      }

      .stat-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .stat-icon svg {
        width: 15px;
        height: 15px;
      }

      .stat.blue .stat-icon {
        background: var(--blue-bg);
        color: var(--blue);
      }
      .stat.yellow .stat-icon {
        background: var(--yellow-bg);
        color: var(--yellow);
      }
      .stat.green .stat-icon {
        background: var(--green-bg);
        color: var(--green);
      }
      .stat.red .stat-icon {
        background: var(--red-bg);
        color: var(--red);
      }

      .stat-num {
        font-family: var(--mono);
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .stat.blue .stat-num {
        color: var(--blue);
      }
      .stat.yellow .stat-num {
        color: var(--yellow);
      }
      .stat.green .stat-num {
        color: var(--green);
      }
      .stat.red .stat-num {
        color: var(--red);
      }

      @keyframes numPop {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1);
        }
      }

      .stat-num.pop {
        animation: numPop 0.28s ease-out;
      }

      /* ── panels ── */
      .panels {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .panel-hd {
        padding: 13px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #fff;
        font-family: var(--mono);
      }

      .panel-title svg {
        width: 14px;
        height: 14px;
        color: var(--sub);
      }

      .panel-bd {
        padding: 14px;
        overflow-y: auto;
        flex: 1;
        max-height: 340px;
      }

      /* ── job cards ── */
      .job-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 11px 14px;
        margin-bottom: 8px;
      }

      .job-card:last-child {
        margin-bottom: 0;
      }

      .job-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 9px;
      }

      .job-id {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
      }
      .job-pct {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--yellow);
      }

      .pbar {
        height: 2px;
        background: var(--dim);
        border-radius: 2px;
        overflow: hidden;
      }
      .pbar-fill {
        height: 100%;
        background: var(--yellow);
        border-radius: 2px;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ── events ── */
      .ev-row {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 7px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }

      .ev-row:last-child {
        border-bottom: none;
      }

      .ev-pip {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        flex-shrink: 0;
        margin-top: 5px;
      }
      .ev-pip.waiting {
        background: var(--blue);
      }
      .ev-pip.active {
        background: var(--yellow);
      }
      .ev-pip.completed {
        background: var(--green);
      }
      .ev-pip.failed {
        background: var(--red);
      }
      .ev-pip.dlq {
        background: var(--purple);
      }
      .ev-pip.progress {
        background: var(--orange);
      }
      .ev-pip.stalled {
        background: var(--sub);
      }

      .ev-msg {
        flex: 1;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--sub);
        line-height: 1.55;
      }
      .ev-msg strong {
        color: var(--text);
        font-weight: 500;
      }
      .ev-ts {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--dim);
        white-space: nowrap;
        padding-top: 2px;
      }

      /* ── dlq ── */
      .dlq-full {
        grid-column: 1 / -1;
      }

      .dlq-card {
        background: var(--panel);
        border: 1px solid rgba(248, 113, 113, 0.1);
        border-radius: var(--r);
        padding: 13px 16px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .dlq-card:last-child {
        margin-bottom: 0;
      }

      .dlq-badge {
        width: 32px;
        height: 32px;
        background: var(--red-bg);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--red);
        flex-shrink: 0;
      }

      .dlq-badge svg {
        width: 15px;
        height: 15px;
      }

      .dlq-body {
        flex: 1;
        min-width: 0;
      }
      .dlq-id {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 3px;
      }
      .dlq-reason {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--red);
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dlq-meta {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--sub);
      }
      .dlq-btns {
        display: flex;
        gap: 8px;
      }

      /* ── empty ── */
      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 40px;
        color: var(--dim);
      }
      .empty svg {
        width: 24px;
        height: 24px;
      }
      .empty span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
      }

      /* ── badge ── */
      .badge {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 20px;
      }
      .badge-yellow {
        background: var(--yellow-bg);
        color: var(--yellow);
        border: 1px solid var(--yellow-border);
      }

      @media (max-width: 960px) {
        main {
          padding: 20px 18px 40px;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .panels {
          grid-template-columns: 1fr;
        }

        .sender {
          flex-direction: column;
          align-items: stretch;
          gap: 14px;
        }

        .field-group {
          width: 100%;
        }

        .dd-wrap,
        .dd-trigger {
          width: 100%;
          min-width: 0;
        }

        .btn-row {
          margin-left: 0;
          justify-content: flex-start;
          flex-wrap: wrap;
        }

        .btn-row .btn {
          flex: 1 1 auto;
          min-width: 140px;
        }

        .panel-bd {
          max-height: 280px;
        }
      }

      @media (max-width: 640px) {
        header {
          padding: 0 16px;
        }

        main {
          padding: 18px 14px 32px;
        }

        .sender {
          gap: 12px;
          padding: 14px 16px;
        }

        .field-group {
          width: 100%;
        }

        .dd-trigger {
          gap: 12px;
          padding: 10px 12px;
        }

        .slider-row input[type="range"] {
          width: 100%;
        }

        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 12px;
        }

        .stat {
          padding: 14px 16px;
        }

        .stat-num {
          font-size: 28px;
        }

        .panels {
          gap: 12px;
        }

        .panel-hd {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .panel-title {
          gap: 6px;
        }

        .panel-bd {
          padding: 12px;
          max-height: 260px;
        }

        .job-card,
        .dlq-card {
          padding: 12px;
        }

        .dlq-card {
          flex-direction: column;
          align-items: stretch;
        }

        .dlq-body {
          min-width: 0;
        }

        .dlq-btns {
          width: 100%;
          justify-content: flex-start;
          flex-wrap: wrap;
          gap: 8px;
        }

        .dlq-btns .btn {
          flex: 1 1 100%;
          min-width: 0;
        }

        .ev-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 6px;
        }

        .ev-ts {
          padding-top: 0;
        }

        .pbar {
          height: 4px;
        }

        .panel,
        .sender,
        .stat {
          border-radius: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wordmark">
        <div class="wordmark-dot"></div>
        taskqueue
      </div>
      <div class="ws-pill" id="wsPill">
        <div class="ws-pip" id="wsPip"></div>
        <span id="wsLabel">connecting</span>
      </div>
    </header>

    <main>
      <!-- sender -->
      <div class="sender">
        <div class="field-group">
          <div class="field-label">job type</div>
          <div class="dd-wrap" id="ddWrap">
            <div class="dd-trigger" id="ddTrigger" onclick="toggleDD()">
              <span id="ddSelected">send_email</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
            <div class="dd-list" id="ddList">
              <ul>
                <li
                  class="selected"
                  data-value="send_email"
                  onclick="selectJob(this)"
                >
                  <span class="li-dot" style="background: var(--blue)"></span>
                  send_email
                </li>
                <li data-value="resize_image" onclick="selectJob(this)">
                  <span class="li-dot" style="background: var(--yellow)"></span>
                  resize_image
                </li>
                <li data-value="webhook" onclick="selectJob(this)">
                  <span class="li-dot" style="background: var(--green)"></span>
                  webhook
                </li>
                <li data-value="unknown_type" onclick="selectJob(this)">
                  <span class="li-dot" style="background: var(--red)"></span>
                  unknown_type
                  <span class="li-tag">→ DLQ</span>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">
            priority —
            <span id="priLabel" style="color: var(--blue)">1 · high</span>
          </div>
          <div class="slider-row">
            <input
              type="range"
              min="1"
              max="10"
              value="1"
              id="priRange"
              oninput="updatePri(this.value)"
            />
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">count</div>
          <input
            type="number"
            class="num-input"
            id="jobCount"
            value="1"
            min="1"
            max="50"
          />
        </div>

        <div class="btn-row">
          <button class="btn btn-blue" onclick="pushJobs()">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            Push
          </button>
          <button class="btn btn-purple" onclick="spamJobs()">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            Spam 20
          </button>
        </div>
      </div>

      <!-- stats -->
      <div class="stats">
        <div class="stat blue">
          <div class="stat-top">
            <span class="stat-name">queued</span>
            <div class="stat-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
            </div>
          </div>
          <div class="stat-num" id="statQueued">0</div>
        </div>

        <div class="stat yellow">
          <div class="stat-top">
            <span class="stat-name">active</span>
            <div class="stat-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
              </svg>
            </div>
          </div>
          <div class="stat-num" id="statActive">0</div>
        </div>

        <div class="stat green">
          <div class="stat-top">
            <span class="stat-name">completed</span>
            <div class="stat-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
            </div>
          </div>
          <div class="stat-num" id="statCompleted">0</div>
        </div>

        <div class="stat red">
          <div class="stat-top">
            <span class="stat-name">failed / dlq</span>
            <div class="stat-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
              </svg>
            </div>
          </div>
          <div class="stat-num" id="statFailed">0</div>
        </div>
      </div>

      <!-- panels -->
      <div class="panels">
        <div class="panel">
          <div class="panel-hd">
            <div class="panel-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <rect x="9" y="9" width="6" height="6" />
                <line x1="9" y1="1" x2="9" y2="4" />
                <line x1="15" y1="1" x2="15" y2="4" />
                <line x1="9" y1="20" x2="9" y2="23" />
                <line x1="15" y1="20" x2="15" y2="23" />
                <line x1="20" y1="9" x2="23" y2="9" />
                <line x1="20" y1="14" x2="23" y2="14" />
                <line x1="1" y1="9" x2="4" y2="9" />
                <line x1="1" y1="14" x2="4" y2="14" />
              </svg>
              active jobs
            </div>
            <span class="badge badge-yellow" id="activeCount">0 running</span>
          </div>
          <div class="panel-bd" id="activeJobs">
            <div class="empty">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span>no active jobs</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-hd">
            <div class="panel-title">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="2" />
                <path
                  d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"
                />
              </svg>
              live events
            </div>
            <button class="btn btn-ghost btn-sm" onclick="clearEvents()">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="width: 12px; height: 12px"
              >
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              </svg>
              clear
            </button>
          </div>
          <div class="panel-bd" id="eventFeed">
            <div class="empty">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" />
              </svg>
              <span>waiting for events...</span>
            </div>
          </div>
        </div>
      </div>

      <!-- dlq -->
      <div class="panel dlq-full">
        <div class="panel-hd">
          <div class="panel-title">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            dead letter queue
          </div>

          <div>
            <button
              class="btn btn-green btn-sm"
              id="retryAllBtn"
              onclick="retryAll()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
              retry all
            </button>
  
            <button
              class="btn btn-red btn-sm"
              id="discardAllBtn"
              onclick="discardAll()"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
              </svg>
              discard all
            </button>
          </div>
        </div>
        <div class="panel-bd" id="dlqList" style="max-height: 260px">
          <div class="empty">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M9 12l2 2 4-4" />
            </svg>
            <span>dlq is empty</span>
          </div>
        </div>
      </div>
    </main>

    <script>
      const state = {
        stats: { queued: 0, active: 0, completed: 0, failed: 0 },
        activeJobs: new Map(),
        events: [],
        maxEvents: 60,
        selectedJob: "send_email",
      };

      function toggleDD() {
        const t = document.getElementById("ddTrigger");
        const l = document.getElementById("ddList");
        const open = l.classList.contains("open");
        t.classList.toggle("open", !open);
        l.classList.toggle("open", !open);
      }

      function selectJob(li) {
        document
          .querySelectorAll("#ddList li")
          .forEach((el) => el.classList.remove("selected"));
        li.classList.add("selected");
        state.selectedJob = li.dataset.value;
        document.getElementById("ddSelected").textContent = li.dataset.value;
        toggleDD();
      }

      document.addEventListener("click", (e) => {
        if (!document.getElementById("ddWrap").contains(e.target)) {
          document.getElementById("ddTrigger").classList.remove("open");
          document.getElementById("ddList").classList.remove("open");
        }
      });

      function updatePri(v) {
        const hint = v <= 2 ? "high" : v <= 5 ? "normal" : "low";
        document.getElementById("priLabel").textContent = `${v} · ${hint}`;
      }

      let ws, reconnTimer;

      function connect() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${proto}//${location.host}`);
        ws.onopen = () => {
          setWs(true);
          clearTimeout(reconnTimer);
          ws.send(JSON.stringify({ type: "subscribe", jobId: "*" }));
          fetchStats();
          fetchDLQ();
        };
        ws.onmessage = ({ data }) => {
          try {
            handle(JSON.parse(data));
          } catch (e) {}
        };
        ws.onclose = () => {
          setWs(false);
          reconnTimer = setTimeout(connect, 3000);
        };
        ws.onerror = () => ws.close();
      }

      function setWs(ok) {
        document.getElementById("wsPip").className =
          "ws-pip" + (ok ? " on" : "");
        document.getElementById("wsLabel").textContent = ok
          ? "live"
          : "reconnecting...";
        document.getElementById("wsPill").className =
          "ws-pill" + (ok ? " connected" : "");
      }

      function handle(msg) {
        switch (msg.type) {
          case "job:waiting":
            state.stats.queued++;
            addEvent("waiting", `job <strong>#${msg.jobId}</strong> queued`);
            tick("statQueued", "queued");
            break;
          case "job:active":
            state.stats.queued = Math.max(0, state.stats.queued - 1);
            state.stats.active++;
            state.activeJobs.set(msg.jobId, { progress: 0 });
            addEvent("active", `job <strong>#${msg.jobId}</strong> picked up`);
            tick("statQueued", "queued");
            tick("statActive", "active");
            renderActive();
            break;
          case "job:progress":
            if (state.activeJobs.has(msg.jobId)) {
              state.activeJobs.get(msg.jobId).progress = msg.progress;
              renderActive();
            }
            addEvent(
              "progress",
              `job <strong>#${msg.jobId}</strong> ${msg.progress}%`,
            );
            break;
          case "job:completed":
            state.stats.active = Math.max(0, state.stats.active - 1);
            state.stats.completed++;
            state.activeJobs.delete(msg.jobId);
            addEvent(
              "completed",
              `job <strong>#${msg.jobId}</strong> completed`,
            );
            tick("statActive", "active");
            tick("statCompleted", "completed");
            renderActive();
            break;
          case "job:failed":
            addEvent(
              "failed",
              `job <strong>#${msg.jobId}</strong> failed — ${msg.failedReason}`,
            );
            break;
          case "job:dlq":
            state.stats.active = Math.max(0, state.stats.active - 1);
            state.stats.failed++;
            state.activeJobs.delete(msg.jobId);
            addEvent(
              "dlq",
              `job <strong>#${msg.jobId}</strong> → dead letter queue`,
            );
            tick("statActive", "active");
            tick("statFailed", "failed");
            renderActive();
            fetchDLQ();
            break;
          case "job:stalled":
            addEvent(
              "stalled",
              `job <strong>#${msg.jobId}</strong> stalled — requeued`,
            );
            break;
        }
      }

      function tick(elId, key) {
        const el = document.getElementById(elId);
        el.textContent = state.stats[key];
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      }

      function updateStats() {
        document.getElementById("statQueued").textContent = state.stats.queued;
        document.getElementById("statActive").textContent = state.stats.active;
        document.getElementById("statCompleted").textContent =
          state.stats.completed;
        document.getElementById("statFailed").textContent = state.stats.failed;
      }

      function renderActive() {
        const el = document.getElementById("activeJobs");
        document.getElementById("activeCount").textContent =
          `${state.activeJobs.size} running`;
        if (state.activeJobs.size === 0) {
          el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>no active jobs</span></div>`;
          return;
        }
        el.innerHTML = [...state.activeJobs.entries()]
          .map(
            ([id, job]) => `
    <div class="job-card">
      <div class="job-row">
        <span class="job-id">job_${id}</span>
        <span class="job-pct">${job.progress}%</span>
      </div>
      <div class="pbar"><div class="pbar-fill" style="width:${job.progress}%"></div></div>
    </div>`,
          )
          .join("");
      }

      function addEvent(type, html) {
        const ts = new Date().toLocaleTimeString("en-US", { hour12: false });
        state.events.unshift({ type, html, ts });
        if (state.events.length > state.maxEvents) state.events.pop();
        document.getElementById("eventFeed").innerHTML = state.events
          .map(
            (e) => `
    <div class="ev-row">
      <div class="ev-pip ${e.type}"></div>
      <div class="ev-msg">${e.html}</div>
      <div class="ev-ts">${e.ts}</div>
    </div>`,
          )
          .join("");
      }

      function clearEvents() {
        state.events = [];
        document.getElementById("eventFeed").innerHTML =
          `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>waiting for events...</span></div>`;
      }

      function renderDLQ(jobs) {
        const el = document.getElementById("dlqList");
        if (!jobs || jobs.length === 0) {
          el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg><span>dlq is empty</span></div>`;
          return;
        }
        el.innerHTML = jobs
          .map(
            (job) => `
    <div class="dlq-card" id="dlq-${job.jobId}">
      <div class="dlq-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div class="dlq-body">
        <div class="dlq-id">#${job.jobId} · ${job.type}</div>
        <div class="dlq-reason">${job.failReason}</div>
        <div class="dlq-meta">${job.attempts} attempts · ${job.failedAt ? new Date(job.failedAt).toLocaleTimeString() : "—"}</div>
      </div>
      <div class="dlq-btns">
        <button class="btn btn-green btn-sm" onclick="retryJob('${job.jobId}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          retry
        </button>
        <button class="btn btn-red btn-sm" onclick="discardJob('${job.jobId}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
          discard
        </button>
      </div>
    </div>`,
          )
          .join("");
      }

      async function fetchStats() {
        try {
          const d = await fetch("/stats").then((r) => r.json());
          state.stats.queued = d.queued;
          state.stats.active = d.active;
          state.stats.completed = d.completed;
          state.stats.failed = d.failed;
          updateStats();
        } catch (e) {}
      }

      async function fetchDLQ() {
        try {
          const d = await fetch("/dlq").then((r) => r.json());
          renderDLQ(d.jobs);
        } catch (e) {}
      }

      async function retryJob(jobId) {
        try {
          const r = await fetch(`/dlq/${jobId}/retry`, { method: "POST" });
          if (!r.ok) return;
          document.getElementById(`dlq-${jobId}`)?.remove();
          state.stats.failed = Math.max(0, state.stats.failed - 1);
          state.stats.queued++;
          updateStats();
          addEvent(
            "waiting",
            `job <strong>#${jobId}</strong> retried from dlq`,
          );
          if (!document.querySelector(".dlq-card")) renderDLQ([]);
        } catch (e) {}
      }

      async function discardJob(jobId) {
        if (!confirm(`Permanently delete job #${jobId}?`)) return;
        try {
          const r = await fetch(`/dlq/${jobId}`, { method: "DELETE" });
          if (!r.ok) return;
          document.getElementById(`dlq-${jobId}`)?.remove();
          state.stats.failed = Math.max(0, state.stats.failed - 1);
          updateStats();
          addEvent("dlq", `job <strong>#${jobId}</strong> discarded`);
          if (!document.querySelector(".dlq-card")) renderDLQ([]);
        } catch (e) {}
      }

      async function retryAll() {
        const btn = document.getElementById("retryAllBtn");
        btn.disabled = true;
        try {
          const d = await fetch("/dlq/retry-all", { method: "POST" }).then(
            (r) => r.json(),
          );
          addEvent(
            "waiting",
            `<strong>${d.retried}</strong> jobs retried from dlq`,
          );
          await fetchDLQ();
          await fetchStats();
        } catch (e) {
        } finally {
          btn.disabled = false;
        }
      }

      async function pushJobs() {
        const priority = parseInt(document.getElementById("priRange").value);
        const count = parseInt(document.getElementById("jobCount").value);
        await Promise.all(
          Array.from({ length: count }, (_, i) =>
            fetch("/jobs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                type: state.selectedJob,
                payload: { index: i + 1 },
                priority,
              }),
            }),
          ),
        );
      }

      async function spamJobs() {
        const types = ["send_email", "resize_image", "webhook"];
        await Promise.all(
          Array.from({ length: 20 }, (_, i) =>
            fetch("/jobs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                type: types[i % 3],
                payload: { index: i + 1 },
                priority: Math.ceil(Math.random() * 5),
              }),
            }),
          ),
        );
      }

      async function discardAll() {
        if (!confirm("Permanently delete ALL jobs in DLQ?")) return;

        const btn = document.getElementById("discardAllBtn");
        btn.disabled = true;

        try {
          const r = await fetch("/dlq", { method: "DELETE" });
          const d = await r.json();

          // update state
          state.stats.failed = 0;
          updateStats();

          // clear the panel
          renderDLQ([]);

          addEvent(
            "dlq",
            `<strong>${d.discarded}</strong> jobs permanently discarded`,
          );
        } catch (e) {
          console.error("discardAll:", e);
        } finally {
          btn.disabled = false;
        }
      }

      setInterval(fetchStats, 10000);
      connect();
    </script>
  </body>
</html>
